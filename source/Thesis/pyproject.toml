[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "thesis-rag"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<2.5",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
models = [
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=4.53,<6",
]
analysis = [
  "statsmodels>=0.14.5,<1",
]

[project.scripts]
thesis = "thesis_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["thesis_rag"]
